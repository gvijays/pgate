<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your pgate login code</title>
</head>
<body style="margin:0;padding:0;background-color:#0D0D0D;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;">
  <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="background-color:#0D0D0D;padding:48px 20px;">
    <tr>
      <td align="center">
        <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="max-width:460px;">

          <!-- Logo -->
          <tr>
            <td align="center" style="padding-bottom:36px;">
              <span style="font-size:22px;font-weight:700;color:#ffffff;letter-spacing:-0.5px;">p<span style="color:#4ADE80;">gate</span></span>
            </td>
          </tr>

          <!-- Card -->
          <tr>
            <td style="background-color:#18181b;border:1px solid #27272a;border-radius:20px;padding:44px 40px;">
              <table width="100%" cellpadding="0" cellspacing="0" role="presentation">

                <!-- Icon -->
                <tr>
                  <td align="center" style="padding-bottom:28px;">
                    <div style="width:60px;height:60px;background-color:rgba(74,222,128,0.12);border:1px solid rgba(74,222,128,0.25);border-radius:16px;display:inline-block;text-align:center;line-height:60px;font-size:26px;">🔑</div>
                  </td>
                </tr>

                <!-- Heading -->
                <tr>
                  <td align="center" style="padding-bottom:8px;">
                    <h1 style="margin:0;font-size:22px;font-weight:700;color:#ffffff;letter-spacing:-0.3px;">Your login code</h1>
                  </td>
                </tr>
                <tr>
                  <td align="center" style="padding-bottom:36px;">
                    <p style="margin:0;font-size:14px;color:#71717a;line-height:1.5;">Enter this code to sign in to pgate.</p>
                  </td>
                </tr>

                <!-- OTP Box -->
                <tr>
                  <td align="center" style="padding-bottom:36px;">
                    <div style="background-color:#0D0D0D;border:1.5px solid #4ADE80;border-radius:14px;padding:22px 48px;display:inline-block;">
                      <span style="font-size:38px;font-weight:700;color:#4ADE80;letter-spacing:10px;font-family:'Courier New',Courier,monospace;">{{ .Token }}</span>
                    </div>
                  </td>
                </tr>

                <!-- Divider -->
                <tr>
                  <td style="padding-bottom:24px;">
                    <div style="height:1px;background-color:#27272a;"></div>
                  </td>
                </tr>

                <!-- Footer note -->
                <tr>
                  <td align="center">
                    <p style="margin:0;font-size:12px;color:#52525b;line-height:1.6;">
                      This code expires in <strong style="color:#71717a;">10 minutes</strong>.<br />
                      If you didn't request this, you can safely ignore this email.
                    </p>
                  </td>
                </tr>

              </table>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" style="padding-top:28px;">
              <p style="margin:0;font-size:12px;color:#3f3f46;">
                <a href="https://pgate.io" style="color:#4ADE80;text-decoration:none;font-weight:500;">pgate.io</a>
                &nbsp;·&nbsp; Password-protect any link
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
